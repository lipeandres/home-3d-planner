<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home 3D Planner</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026ee; --line:#2f343d; --fg:#e8eaee; --dim:#9aa1ad; --acc:#ff9f43; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; overflow:hidden; }
  canvas { display:block; }
  .panel { position:fixed; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; backdrop-filter:blur(8px); max-height:calc(100% - 24px); overflow:auto; }
  #left { top:0; left:0; bottom:0; width:262px; max-height:none; border-radius:0; border-width:0 1px 0 0; padding:10px 10px 16px; }
  #right { top:56px; right:12px; width:230px; display:none; z-index:8; }
  #left { transition:transform .16s ease, visibility 0s; }
  body.sb-closed #left { transform:translateX(-103%); visibility:hidden; transition:transform .16s ease, visibility 0s .16s; }
  body.sb-closed.sb-peek #left { transform:none; visibility:visible; z-index:10; box-shadow:10px 0 28px #000a; transition:transform .16s ease, visibility 0s; }
  /* edge rail (Vivaldi-style): thin full-height bar with an arrow; click to show / hide the menu */
  #sbRail { position:fixed; top:0; bottom:0; left:262px; width:12px; z-index:11; display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none;
    background:#171a20; border-left:1px solid var(--line); border-right:1px solid var(--line); color:var(--dim); }
  #sbRail:hover { background:#232832; color:var(--fg); }
  #sbArrow::before { content:'◂'; font-size:11px; }          /* menu pinned: the arrow points left = hide */
  body.sb-closed:not(.sb-peek) #sbRail { left:0; }
  body.sb-closed #sbArrow::before { content:'▸'; }           /* menu hidden or only peeking: points right = show / dock */
  body.sb-closed { --sbw:12px; }
  :root { --sbw:274px; }                               /* space the stage leaves: the 262px menu + the 12px rail (just the rail while the menu is hidden) */
  #sbHoverRow { margin:0 0 8px; }
  /* always-visible bar, top right: menu pin + view layouts (+ swap in split view) */
  #vbar { position:fixed; top:8px; right:10px; z-index:12; display:flex; align-items:center; gap:4px; padding:4px; background:var(--panel); border:1px solid var(--line); border-radius:9px; backdrop-filter:blur(8px); }
  #vbar button { padding:3px 5px; line-height:0; color:var(--dim); }
  #vbar button.on { color:#111; }
  #vbar #mainSwap { font-size:15px; line-height:1; padding:2px 8px; }
  #vbar .vsep { width:1px; align-self:stretch; background:var(--line); margin:0 2px; }
  #vbar svg { width:34px; height:20px; stroke:currentColor; fill:none; stroke-width:1.3; }
  #vbar svg text { fill:currentColor; stroke:none; font-size:7.5px; font-weight:700; }
  #vbar svg .f { fill:currentColor; fill-opacity:.35; }
  [data-layout="split"][data-swap="1"] #view3d { left:0; width:calc(var(--split) * 100%); right:auto; border-left:0; border-right:1px solid var(--line); }
  [data-layout="split"][data-swap="1"] #viewPlan { left:calc(var(--split) * 100%); width:auto; right:0; border-left:1px solid var(--line); }
  .grp { margin:14px 0 8px; padding-top:8px; border-top:1px solid var(--line); font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--acc); }
  .sbtop button { font-size:12px; padding:4px 6px; }
  #layouts { gap:5px; } #layouts button { padding:3px; flex:1 1 0; line-height:0; color:var(--dim); }
  #layouts button.on { color:#111; }
  #layouts svg { width:100%; max-width:40px; height:24px; stroke:currentColor; fill:none; stroke-width:1.3; }
  #layouts svg text { fill:currentColor; stroke:none; font-size:7.5px; font-weight:700; }
  #layouts svg .f { fill:currentColor; fill-opacity:.35; }
  #layName { margin-top:5px; }
  /* stage: the 3D view and the plan view live here, arranged by data-layout */
  #stage { position:fixed; top:0; right:0; bottom:0; left:var(--sbw); background:var(--bg); }
  .vw { position:absolute; display:flex; flex-direction:column; background:var(--bg); overflow:hidden; min-width:0; min-height:0; }
  .vw.floating { z-index:6; border:1px solid #3d4452; border-radius:10px; box-shadow:0 10px 30px #000a; }
  .vhead { display:none; align-items:center; gap:6px; padding:5px 8px; cursor:move; background:var(--panel); border-bottom:1px solid var(--line); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); user-select:none; }
  .vw.floating .vhead { display:flex; }
  .vw.floating #planHead { cursor:move; }
  .vw:not(.floating) .fl { display:none; }
  .vhead button, #planHead button { padding:3px 7px; font-size:12px; }
  .vresize { display:none; position:absolute; right:0; bottom:0; width:18px; height:18px; cursor:nwse-resize; z-index:4;
    background:linear-gradient(135deg, transparent 52%, #9aa1ad 52%, #9aa1ad 60%, transparent 60%, transparent 72%, #9aa1ad 72%, #9aa1ad 80%, transparent 80%); }
  .vw.floating .vresize { display:block; }
  [data-layout="v3d"] #view3d, [data-layout="float-plan"] #view3d, [data-layout="plan-float3d"] #viewPlan, [data-layout="plan"] #viewPlan { inset:0; }
  [data-layout="v3d"] #viewPlan, [data-layout="plan"] #view3d { display:none; }
  [data-layout="split"] #viewPlan { left:0; top:0; bottom:0; width:calc(var(--split) * 100%); }
  [data-layout="split"] #view3d { left:calc(var(--split) * 100%); top:0; right:0; bottom:0; border-left:1px solid var(--line); }
  #divider { display:none; position:absolute; top:0; bottom:0; width:10px; margin-left:-5px; cursor:col-resize; z-index:7; }
  #divider::after { content:''; position:absolute; left:4px; top:50%; width:2px; height:36px; margin-top:-18px; border-radius:2px; background:#5b6575; }
  [data-layout="split"] #divider { display:block; left:calc(var(--split) * 100%); }
  #v3dBody { position:relative; flex:1 1 0; min-height:0; overflow:hidden; }
  #plan { display:flex; flex-direction:column; flex:1 1 0; min-height:0; padding:6px; background:var(--panel); }
  #planHead { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:6px; user-select:none; }
  #planHead b { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  #planCanvas { flex:1 1 0; min-height:0; width:100%; height:0; display:block; border-radius:6px; touch-action:none; cursor:grab; }
  #planTools { display:none; flex-wrap:wrap; gap:6px; margin-top:8px; }
  #planTools.on { display:flex; }
  #planTools button { padding:3px 7px; font-size:12px; }
  h3 { margin:0 0 6px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  .sec { margin-bottom:12px; } .sec:last-child { margin-bottom:0; }
  button { background:#2a2f38; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 8px; cursor:pointer; font:inherit; }
  button:hover { background:#353b46; } button.on { background:var(--acc); color:#111; border-color:var(--acc); }
  .row { display:flex; gap:6px; flex-wrap:wrap; } .row > * { flex:1 1 auto; }
  .cat { display:grid; grid-template-columns:1fr 1fr; gap:5px; }
  .cat button { text-align:left; font-size:12px; } .cat small { color:var(--dim); display:block; }
  input[type=range] { width:100%; }
  label { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:4px 0; color:var(--dim); }
  input[type=number], input[type=text] { width:90px; background:#12141a; color:var(--fg); border:1px solid var(--line); border-radius:5px; padding:3px 5px; font:inherit; }
  input[type=text] { width:120px; } input[type=color] { width:42px; height:24px; border:0; background:none; padding:0; }
  #status { position:absolute; left:12px; top:10px; max-width:calc(100% - 24px); text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:5px 14px; color:var(--dim); pointer-events:none; z-index:2; }
  #label { position:absolute; pointer-events:none; background:#000c; color:#fff; padding:2px 7px; border-radius:4px; font-size:12px; transform:translate(-50%,-130%); display:none; white-space:nowrap; }
  #loading { position:fixed; inset:0; display:grid; place-items:center; background:var(--bg); z-index:9; font-size:15px; color:var(--dim); }
  #cross { position:absolute; left:50%; top:50%; width:8px; height:8px; margin:-4px; border:1px solid #fff9; border-radius:50%; display:none; pointer-events:none; }
  kbd { background:#2a2f38; border:1px solid var(--line); border-radius:4px; padding:0 4px; font-size:11px; }
  #planCtx { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  label.chk { display:inline-flex; margin:0 6px 0 0; gap:4px; font-size:12px; }
  #planTools .sep { width:1px; background:var(--line); margin:0 2px; flex:0 0 1px; }
  #planCtx { margin:6px 0 0; min-height:22px; font-size:12px; color:var(--dim); align-items:center; }
  #planCtx input[type=text], #planCtx input[type=number] { width:130px; }
  #planCtx input[type=number] { width:60px; }
  .panel { z-index:5; }
  .roomlabel { z-index:1; position:absolute; pointer-events:none; transform:translate(-50%,-50%); background:#0a2a55cc; color:#fff; border:1px solid #6fa8ff88; padding:1px 8px; border-radius:10px; font-size:12px; white-space:nowrap; display:none; }
  .srow { display:flex; gap:4px; align-items:center; margin:3px 0; }
  .srow input { flex:1; min-width:0; width:auto; }
  .srow.on input { border-color:var(--acc); }
  .srow small { color:var(--dim); font-size:10px; }
  .srow button { padding:2px 6px; flex:0 0 auto; }
  .foldrow { margin-bottom:10px; }
  .foldrow button { font-size:12px; padding:4px 6px; }
  .fold { cursor:pointer; user-select:none; display:flex; justify-content:space-between; align-items:center; }
  .fold::after { content:'▾'; font-size:12px; opacity:.8; }
  .sec.collapsed > .fold::after { content:'▸'; }
  .sec.collapsed > .secbody { display:none; }
  .lockbtn { width:100%; }
  .lockbtn.locked { background:#6b2d2d; border-color:#a04a4a; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  #planCtx .hint { line-height:1.4; }
  .sgroup { display:flex; align-items:center; gap:6px; margin:8px 0 2px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); }
  .sgroup:first-child { margin-top:0; }
  input[type=color].cdot { width:20px; height:20px; padding:0; border:0; background:none; flex:0 0 20px; cursor:pointer; }
  input[type=color].cdot::-webkit-color-swatch-wrapper { padding:0; }
  input[type=color].cdot::-webkit-color-swatch { border:1.5px solid #ffffff66; border-radius:50%; }
  .sgroup .reset, .srow .reset { padding:1px 6px; font-size:11px; flex:0 0 auto; }
  .sgroup .grow { flex:1; }
  .dot { width:10px; height:10px; border-radius:50%; flex:0 0 10px; }
  .sel { width:100%; background:#12141a; color:var(--fg); border:1px solid var(--line); border-radius:5px; padding:4px; }
  .help { color:var(--dim); font-size:11.5px; line-height:1.7; }
  #welcome { position:fixed; inset:0; z-index:100; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:16px; }
  .wbox { max-width:460px; text-align:center; } .wbox h1 { margin:0 0 10px; font-size:26px; } .wbox p { margin:8px 0; font-size:14px; line-height:1.5; }
  .dim { color:var(--dim); } .werr { color:#ff6b6b; margin-top:10px; min-height:1.4em; }
  .wpick { display:inline-block; margin:16px 0 8px; padding:12px 22px; border-radius:8px; background:var(--acc); color:#111; font-weight:700; font-size:15px; cursor:pointer; }
  #cleanBar { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:40; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 14px; display:flex; gap:10px; align-items:center; max-width:92vw; }
  #cleanBar[hidden] { display:none; }
  .credit { border-top:1px solid var(--line); margin-top:14px; padding-top:10px; } .credit a { color:var(--acc); } .credit ul { margin:6px 0 0; padding-left:16px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.8.3/build/index.module.js"
} }
</script>
</head>
<body>
<div id="cleanBar" hidden><span id="cleanMsg"></span><button id="cleanRetry" hidden data-i18n="cleanRetry"></button></div>
<input id="scanFile" type="file" accept=".glb,model/gltf-binary" hidden>
<input id="bkFile" type="file" accept="application/json" hidden>
<div id="loading"><span data-i18n="loading"></span> <span id="pct" style="margin-left:8px"></span></div>
<div id="vbar">
  <span id="vbarLayouts" class="row" style="gap:4px;flex-wrap:nowrap"></span>
  <button id="mainSwap" title="⇄">⇄</button>
</div>
<div id="sbRail" role="button"><span id="sbArrow"></span></div>

<div id="left" class="panel">
  <label id="sbHoverRow"><span data-i18n="sbHover"></span> <input type="checkbox" id="sbHover" checked></label>
  <div class="row sbtop foldrow">
    <button id="foldAll" data-i18n="collapseAll"></button>
    <button id="unfoldAll" data-i18n="expandAll"></button>
  </div>
  <div class="sec">
    <h3 data-i18n="layoutTitle"></h3>
    <div class="row" id="layouts"></div>
    <button id="mainSwapSb" style="width:100%;margin-top:6px" data-i18n="swapMain"></button>
    <div class="help" id="layName"></div>
  </div>
  <div class="sec">
    <h3 data-i18n="house"></h3>
    <select id="model" class="sel"></select>
    <div class="row" style="margin-top:6px"><button id="scanAdd" data-i18n="scanAdd"></button><button id="scanDel" data-i18n="scanDel"></button></div>
    <div class="row" style="margin-top:6px"><button id="bkSave" data-i18n="bkSave"></button><button id="bkLoad" data-i18n="bkLoad"></button></div>
    <div class="help" data-i18n="bkHelp"></div>
    <h3 style="margin-top:8px" data-i18n="language"></h3>
    <select id="lang" class="sel"></select>
  </div>

  <div class="grp" data-i18n="grp3d"></div>
  <div class="sec">
    <h3 data-i18n="model"></h3>
    <div class="row">
      <button id="vmScan" data-i18n="modelScan"></button>
      <button id="vmClean" data-i18n="modelClean"></button>
      <button id="vmOverlay" data-i18n="modelOverlay"></button>
    </div>
    <label style="margin-top:6px"><span data-i18n="showNames"></span> <input type="checkbox" id="showNames3d" checked></label>
  </div>
  <div class="sec">
    <h3 data-i18n="view"></h3>
    <div class="row">
      <button id="bOrbit" class="on" data-i18n="orbit"></button>
      <button id="bWalk" data-i18n="walk"></button>
      <button id="bAvatar" data-i18n="avatar"></button>
      <button id="bMeasure" data-i18n="measure"></button>
    </div>
    <div class="row" style="margin-top:6px">
      <button id="bTop" data-i18n="topdown"></button>
      <button id="bLower" data-i18n="lowerFloor"></button>
      <button id="bBoth" data-i18n="both"></button>
    </div>
    <label style="margin-top:8px"><span data-i18n="cutHeight"></span> <span id="cutv"></span></label>
    <input id="cut" type="range" min="-4.1" max="2.4" step="0.05" value="2.4">
    <label style="margin-top:8px"><span data-i18n="wallOpacity"></span> <span id="wallOpv"></span></label>
    <input id="wallOp" type="range" min="10" max="100" step="5" value="100">
    <label style="margin-top:4px"><span data-i18n="wallEdges"></span> <input type="checkbox" id="wallEdges"></label>
  </div>
  <div class="sec">
    <h3 data-i18n="doors"></h3>
    <div class="row">
      <button id="dmClosed" data-i18n="doorsClosed"></button>
      <button id="dmOpen" data-i18n="doorsOpen"></button>
      <button id="dmSet" data-i18n="doorsSet"></button>
    </div>
  </div>
  <div class="sec" id="envSec">
    <h3 data-i18n="env"></h3>
    <label><span data-i18n="enOn"></span> <input type="checkbox" id="enOn"></label>
    <label style="margin-top:6px"><span data-i18n="enAz"></span> <span id="enAzv"></span></label>
    <input id="enAz" type="range" min="0" max="360" step="5" value="35">
    <label><span data-i18n="enEl"></span> <span id="enElv"></span></label>
    <input id="enEl" type="range" min="-10" max="90" step="2" value="48">
    <label><span data-i18n="enInt"></span> <span id="enIntv"></span></label>
    <input id="enInt" type="range" min="0" max="200" step="5" value="100">
    <label style="margin-top:4px"><span data-i18n="enSh"></span> <input type="checkbox" id="enSh"></label>
    <label><span data-i18n="enNb"></span> <input type="checkbox" id="enNb"></label>
    <label><span data-i18n="enYard"></span> <input type="checkbox" id="enYard"></label>
    <div class="help" data-i18n="enHelp"></div>
  </div>
  <div class="sec" id="styleSec">
    <h3 data-i18n="style"></h3>
    <select id="stPreset" class="sel"></select>
    <label style="margin-top:6px"><span data-i18n="stWall"></span> <input type="color" id="stWall"></label>
    <label><span data-i18n="stFinish"></span> <select id="stFinish" class="sel" style="width:auto"></select></label>
    <label><span data-i18n="stFloorMat"></span> <select id="stFloorMat" class="sel" style="width:auto"></select></label>
    <label><span data-i18n="stFloor"></span> <input type="color" id="stFloor"></label>
    <label><span data-i18n="stCeil"></span> <input type="color" id="stCeil"></label>
    <label><span data-i18n="stTrim"></span> <input type="color" id="stTrim"></label>
    <label><span data-i18n="stRail"></span> <input type="color" id="stRail"></label>
    <label style="margin-top:6px"><span data-i18n="stWarm"></span> <span id="stWarmv"></span></label>
    <input id="stWarm" type="range" min="0" max="100" step="5" value="30">
  </div>
  <div class="sec">
    <h3 data-i18n="pnTitle"></h3>
    <div class="row"><button id="pnToggle" data-i18n="pnPaint"></button><button id="pnErase" data-i18n="pnErase"></button><input type="color" id="pnColor" class="cdot"></div>
    <div class="row" id="pnSwatches" style="margin-top:6px;flex-wrap:wrap"></div>
    <div class="help" data-i18n="pnHelp"></div>
  </div>
  <div class="sec">
    <h3 data-i18n="rnTitle"></h3>
    <textarea id="rnNotes" class="sel" rows="2" style="width:100%;resize:vertical" data-i18n-ph="rnNotes"></textarea>
    <div class="row" style="margin-top:6px">
      <button id="rnDownload" data-i18n="rnDownload"></button>
      <button id="rnCopy" data-i18n="rnCopy"></button>
      <button id="rnGem" data-i18n="rnGem"></button>
    </div>
    <div class="row" style="margin-top:6px"><button id="rnApi" data-i18n="rnApi" hidden></button></div>
    <div class="help" id="rnHelp" data-i18n="rnHelp"></div>
  </div>

  <div class="grp" data-i18n="grpPlan"></div>
  <div class="sec">
    <h3 data-i18n="planOptions"></h3>
    <label><span data-i18n="alignWalls"></span> <input type="checkbox" id="planAlign" checked></label>
    <label><span data-i18n="showScan"></span> <input type="checkbox" id="planTrace"></label>
    <div class="row" style="margin-top:6px">
      <button id="planArea" data-i18n="area"></button>
      <button id="planEdit" data-i18n="edit"></button>
    </div>
    <div id="planTools"></div>
  </div>

  <div class="grp" data-i18n="grpContent"></div>
  <div class="sec">
    <h3 data-i18n="addFurniture"></h3>
    <button id="bLock" class="lockbtn"></button>
    <div class="cat" id="cat" style="margin-top:6px"></div>
  </div>
  <div class="sec">
    <h3 data-i18n="layout"></h3>
    <div class="row"><select id="lySel" class="sel" style="flex:1"></select></div>
    <div class="row" style="margin-top:6px"><button id="lyNew" data-i18n="lyNew"></button><button id="lyCopy" data-i18n="lyCopy"></button><button id="lyDel" data-i18n="lyDel"></button></div>
    <div class="row" style="margin-top:6px">
      <button id="bExport" data-i18n="export"></button>
      <button id="bImport" data-i18n="import"></button>
      <button id="bClear" data-i18n="clear"></button>
    </div>
    <input id="file" type="file" accept="application/json" hidden>
  </div>
  <div class="sec">
    <h3 data-i18n="spaces"></h3>
    <div id="spaces"></div>
    <label style="margin-top:6px"><span data-i18n="showNames"></span> <input type="checkbox" id="showNames" checked></label>
    <label style="margin-top:4px"><span data-i18n="tintFloors"></span> <input type="checkbox" id="tintFloors"></label>
    <label style="margin-top:4px"><span data-i18n="linkLabels"></span> <input type="checkbox" id="linkLabels" checked></label>
  </div>
  <div class="sec help" data-i18n-html="help"></div>
  <div class="credit help">
    <div><span data-i18n="createdBy"></span> <b>Felipe Navarro Murcia</b></div>
